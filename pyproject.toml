[project]
name = "trippilot"
version = "2.0.0"
description = "AI-powered travel companion with multi-agent architecture for personalized itineraries and recommendations"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "VikramxD", email = "singh.vikram.1782000@gmail.com" }]
requires-python = ">=3.11"
keywords = ["travel", "ai", "agents", "llm", "rag", "itinerary", "recommendations"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core AI/LLM
    "openai>=1.50.0",
    "anthropic>=0.39.0",
    "litellm>=1.50.0",

    # Agent Framework
    "pydantic-ai>=0.0.15",
    "langgraph>=0.2.0",

    # RAG & Vector DB
    "chromadb>=0.5.0",
    "lancedb>=0.13.0",
    "sentence-transformers>=3.0.0",

    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",

    # Data Processing
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",

    # Observability
    "logfire>=1.0.0",
    "wandb>=0.18.0",
    "structlog>=24.4.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
    "rich>=13.9.0",
    "typer>=0.12.0",

    # Search & APIs
    "duckduckgo-search>=6.3.0",
    "aiohttp>=3.10.0",

    # Data Sources
    "datasets>=3.0.0",
    "transformers>=4.45.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
    "pre-commit>=4.0.0",
]

analysis = [
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "wordcloud>=1.9.0",
    "nltk>=3.9.0",
    "scikit-learn>=1.5.0",
]

[project.scripts]
trippilot = "trippilot.cli:app"

[project.urls]
Homepage = "https://github.com/VikramxD/TripPilot"
Documentation = "https://github.com/VikramxD/TripPilot#readme"
Repository = "https://github.com/VikramxD/TripPilot"
Issues = "https://github.com/VikramxD/TripPilot/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trippilot"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B009",   # do not call getattr with a constant attribute value
]

[tool.ruff.lint.isort]
known-first-party = ["trippilot"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=src/trippilot --cov-report=term-missing"
